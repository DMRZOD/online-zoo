    <title>Online Zoo</title>

  <body>
    <header class="header">
      <div class="header__container">
        <h1>Online Zoo</h1>

        <a href="/" class="header__logo">
          <img src="/icons/logo.svg" alt="Online Zoo Logo" />
        </a>

        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="/#about" class="header__nav-link">About</a>

            <li class="header__nav-item">
              <a href="/" class="header__nav-link">Contact Us</a>
            </li>
            <li class="header__nav-item">

                href="https://www.figma.com/file/lnK11foY8Aoa6oOlDXovVN/Online-ZOO-Project"
                class="header__nav-link"
                target="_blank"
              >
                Design
              </a>
            </li>
          </ul>

          <div class="header__social">
            <a
              href="https://youtube.com"
              class="header__social-link"
              target="_blank"
            >
              <img src="/icons/youtube.svg" alt="YouTube" />
            </a>
            <a
              href="https://instagram.com"
              class="header__social-link"
              target="_blank"
            >
              <img src="/icons/instagram.svg" alt="Instagram" />
            </a>
            <a
              href="https://facebook.com"
              class="header__social-link"
              target="_blank"
            >
              <img src="/icons/facebook.svg" alt="Facebook" />
            </a>
          </div>
        </nav>

        <button class="header__burger">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="header__overlay"></div>
      </div>
    </header>

    <main class="main">
      <section class="map">
        <h3 class="map__title">Find where are the animals live</h3>
        <div class="map__wrapper">
          <img src="/images/map.jpg" alt="Map" class="map__image" />

          <button class="marker marker_eagle">
            <span class="marker__icon">
              <img src="/icons/map/eagle.svg" alt="Eagle" />
            </span>
          </button>

          <button class="marker marker_alligator">
            <span class="marker__icon">
              <img src="/icons/map/alligator.svg" alt="Alligator" />
            </span>
          </button>

          <button class="marker marker_lion">
            <span class="marker__icon">
              <img src="/icons/map/lion.svg" alt="Lion" />
            </span>
          </button>

          <button class="marker marker_gorilla">
            <span class="marker__icon">
              <img src="/icons/map/gorilla.svg" alt="Gorilla" />
            </span>
          </button>

          <button class="marker marker_lemur">
            <span class="marker__icon">
              <img src="/icons/map/lemur.svg" alt="Lemur" />
            </span>
          </button>

          <button class="marker marker_panda">
            <span class="marker__icon">
              <img src="/icons/map/panda.svg" alt="Panda" />
            </span>
          </button>

          <button class="marker marker_tiger">
            <span class="marker__icon">
              <img src="/icons/map/tiger.svg" alt="Tiger" />
            </span>
          </button>

          <button class="marker marker_coala">
            <span class="marker__icon">
              <img src="/icons/map/coala.svg" alt="Koala" />
            </span>
          </button>
        </div>
      </section>
    </main>

          <div class="footer__logos">
            <a href="/" class="footer__logo">
              <img src="/icons/logo-white.svg" alt="Online Zoo" />
            </a>
            <a
              href="https://yemdigital.com"
              class="footer__logo"
              target="_blank"
            >
              <img src="/icons/yem-logo.svg" alt="Yem Digital" />
            </a>
            <a href="https://rs.school" class="footer__logo" target="_blank">
              <img src="/icons/rs-school-logo.svg" alt="RS School" />
            </a>
          </div>

          <nav class="footer__nav">
            <a href="/#about" class="footer__nav-link">About</a>
            <a href="/pages/map.html" class="footer__nav-link">Map</a>
            <a href="/" class="footer__nav-link">Zoos</a>
            <a href="/" class="footer__nav-link">Contact Us</a>

              <img src="/icons/instagram.svg" alt="Instagram" />
            </a>
            <a
              href="https://facebook.com"
              class="header__social-link"
              target="_blank"
            >
              <img src="/icons/facebook.svg" alt="Facebook" />
            </a>
          </div>
        </div>
